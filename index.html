<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }
        .profile-card {
            position: relative;
            width: 300px;
            height: 400px;
            background: linear-gradient(135deg, #a8c0ff, #ff6f61);
            border-radius: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #333;
        }
        .profile-image {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid #fff;
            overflow: hidden;
            margin-top: 20px;
        }
        .profile-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .profile-name {
            margin: 10px 0 5px;
            font-size: 24px;
            font-weight: bold;
        }
        .profile-badges {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .badge {
            padding: 5px 10px;
            background-color: rgba(255, 255, 255, 0.7);
            border-radius: 12px;
            font-size: 12px;
        }
        .profile-bio {
            text-align: center;
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
        }
        .follow-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 120px;
            height: 40px;
            background-color: #000;
            color: #fff;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .follow-btn:hover {
            background-color: #333;
        }
        .icons {
            display: flex;
            gap: 15px;
        }
        .icon {
            width: 30px;
            height: 30px;
            background-color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .icon:hover {
            background-color: #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="profile-card">
        <div class="profile-image">
            <img src="https://via.placeholder.com/100" alt="Profile Picture">
        </div>
        <div class="profile-name">Verona Nov</div>
        <div class="profile-badges">
            <span class="badge">Writer</span>
            <span class="badge">Golden User</span>
        </div>
        <div class="profile-bio">
            I write short stories and fanfiction for the most popular fandoms
        </div>
        <button class="follow-btn">+ Follow</button>
        <div class="icons">
            <div class="icon"><img src="https://via.placeholder.com/20" alt="Message"></div>
            <div class="icon"><img src="https://via.placeholder.com/20" alt="Bell"></div>
        </div>
    </div>
</body>
</html>
