<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>Profile Card</title>
</head>
<body>

  <div class="profile-wrapper">
    <div class="profile-card">
      <div class="profile-top"></div>

      <div class="profile-content">
        <div class="profile-img">
          <img src="your-image.jpg" alt="Profile">
        </div>

        <h2 class="name">Your Name</h2>

        <div class="tags">
          <span class="tag writer">Writer</span>
          <span class="tag golden">Golden User</span>
        </div>

        <p class="description">
          Your description goes here. Add any short bio text.
        </p>

        <div class="actions">
          <button class="follow-btn">+ Follow</button>
          <div class="icon-btn"><i>📩</i></div>
          <div class="icon-btn"><i>🔔</i></div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
